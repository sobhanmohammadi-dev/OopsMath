schema_version: 1

stage:
  id: 001_first_wall
  title: stage.001_first_wall.title
  description: stage.001_first_wall.description
  difficulty: tutorial
  level: 1

learning:
  question: stage.001_first_wall.question
  curriculum:
    grade: {min: 7, max: 8}
    topics: [multiplication]
  lesson:
    markdown: lesson.md
  solution:
    markdown: solution.md

world:
  bounds:
    size: [16, 8, 16]
  environment:
    preset: meadow

construction:
  allowed_blocks:
    # max_count = most instances of the block that may be placed at once
    - {id: block.wood_log, min_count: 0, max_count: 20}
  # A plan the player can inspect and follow (Compiler 1.2). `position` is the block's
  # anchor cell relative to the world origin; `rotation` is optional (0, 90, 180, 270).
  blueprints:
    - id: bp_wall_a
      title: stage.001_first_wall.blueprint.wall
      blocks:
        - {block: block.wood_log, position: [0, 0, 0]}
        - {block: block.wood_log, position: [1, 0, 0]}
        - {block: block.wood_log, position: [2, 0, 0]}
        - {block: block.wood_log, position: [3, 0, 0]}
        - {block: block.wood_log, position: [0, 1, 0]}
        - {block: block.wood_log, position: [1, 1, 0]}
        - {block: block.wood_log, position: [2, 1, 0]}
        - {block: block.wood_log, position: [3, 1, 0], rotation: 0}
  allowed_tools:
    - {id: hammer}
  starting_inventory:
    blocks: {block.wood_log: 12}   # what the player owns at the start
    tools: {hammer: 1}
  targets:
    - id: wall_a
      type: wall
      region: {min: [0, 0, 0], max: [3, 2, 0]}
      required_block: block.wood_log

economy:
  budget: 100

objectives:
  tasks:
    - id: t_math
      type: math
      math:
        type: multiplication
        answer: {mode: exact, value: 12}
    - {id: t_build, type: construction, depends_on: [t_math], target: wall_a}
    # Block-count objective (Compiler 1.1): place 12 logs AND solve t_math.
    - id: t_logs
      type: construction
      data:
        kind: place_block
        block: block.wood_log
        count: 12
        title: stage.001_first_wall.objective.logs
        requires_challenge: t_math
  completion:
    all:
      - task_completed: t_math
      - target_completed: wall_a
      - task_completed: t_logs

rewards:
  money: 100
  xp: 10

localization:
  ftl: localization
  namespace: stage.001_first_wall
