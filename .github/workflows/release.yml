name: Release

# Publishes a GitHub Release with a ready-to-run package for Windows, Linux and
# macOS whenever a version tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# It can also be started by hand (Actions -> Release -> Run workflow) to get the
# packages as workflow artifacts without publishing a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, binary: oopsmath.exe }
          - { name: linux-x64,   os: ubuntu-latest,  binary: oopsmath }
          - { name: macos-arm64, os: macos-latest,   binary: oopsmath }
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p oopsmath

      - name: Check that the folders the game needs exist
        shell: bash
        run: |
          test -d assets || { echo "::error::assets/ is missing from the repository"; exit 1; }
          test -d stages || { echo "::error::stages/ is missing from the repository"; exit 1; }
          ls stages/*.dat > /dev/null || { echo "::error::stages/ contains no .dat files"; exit 1; }

      # Layout of the package (the game looks for assets/ and stages/ next to
      # the executable):
      #   oopsmath-<version>-<platform>/
      #     oopsmath(.exe)
      #     assets/
      #     stages/
      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then version="dev-${GITHUB_SHA::7}"; fi
          name="oopsmath-${version}-${{ matrix.name }}"
          mkdir "dist"
          mkdir "dist/${name}"
          cp "target/release/${{ matrix.binary }}" "dist/${name}/"
          cp -R assets "dist/${name}/assets"
          cp -R stages "dist/${name}/stages"
          cp LICENSE "dist/${name}/"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ steps.package.outputs.name }}" -DestinationPath "dist/${{ steps.package.outputs.name }}.zip"

      - name: Zip (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: cd dist && zip -r "${{ steps.package.outputs.name }}.zip" "${{ steps.package.outputs.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: List the packages
        run: ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
