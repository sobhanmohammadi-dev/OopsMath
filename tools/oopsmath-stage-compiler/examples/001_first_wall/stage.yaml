schema_version: 1

stage:
  id: 001_first_wall
  title: stage.001_first_wall.title
  description: stage.001_first_wall.description
  difficulty: tutorial
  level: 1

learning:
  question: stage.001_first_wall.question
  curriculum:
    grade: {min: 7, max: 8}
    topics: [multiplication]
  lesson:
    markdown: lesson.md
  solution:
    markdown: solution.md

world:
  bounds:
    size: [16, 8, 16]
  environment:
    preset: meadow

construction:
  allowed_blocks:
    - {id: brick, min_count: 0, max_count: 20}
  allowed_tools:
    - {id: hammer}
  starting_inventory:
    tools: {hammer: 1}
  targets:
    - id: wall_a
      type: wall
      region: {min: [0, 0, 0], max: [3, 2, 0]}
      required_block: brick

economy:
  budget: 100

objectives:
  tasks:
    - id: t_math
      type: math
      math:
        type: multiplication
        answer: {mode: exact, value: 12}
    - {id: t_build, type: construction, depends_on: [t_math], target: wall_a}
  completion:
    all:
      - task_completed: t_math
      - target_completed: wall_a

rewards:
  money: 100
  xp: 10

localization:
  ftl: localization
  namespace: stage.001_first_wall
